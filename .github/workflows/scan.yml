name: KestrelOps Scan

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/Chart.yaml'
      - '**/templates/**'
  push:
    branches: [main, master]

jobs:
  build-scanner:
    name: Build Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: scanner/go.sum

      - name: Build scanner binary
        run: go build -o kestrel-scanner ./cmd/main.go
        working-directory: scanner

      - name: Build CLI binary
        run: go build -o kestrel ./cmd/cli/main.go
        working-directory: scanner

      - name: Run Go tests
        run: go test ./...
        working-directory: scanner

  install-tools:
    name: Install Scan Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pluto
        run: |
          curl -sSL https://github.com/FairwindsOps/pluto/releases/latest/download/pluto_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin pluto
          pluto version

      - name: Install polaris
        run: |
          curl -sSL https://github.com/FairwindsOps/polaris/releases/latest/download/polaris_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin polaris
          polaris version

      - name: Install kube-score
        run: |
          curl -sSL https://github.com/zegl/kube-score/releases/latest/download/kube-score_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin kube-score
          kube-score version

  scan-examples:
    name: Scan Example Manifests
    runs-on: ubuntu-latest
    needs: [build-scanner, install-tools]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: scanner/go.sum

      - name: Install scan tools
        run: |
          curl -sSL https://github.com/FairwindsOps/pluto/releases/latest/download/pluto_linux_amd64.tar.gz | tar -xz -C /usr/local/bin pluto
          curl -sSL https://github.com/FairwindsOps/polaris/releases/latest/download/polaris_linux_amd64.tar.gz | tar -xz -C /usr/local/bin polaris
          curl -sSL https://github.com/zegl/kube-score/releases/latest/download/kube-score_linux_amd64.tar.gz | tar -xz -C /usr/local/bin kube-score

      - name: Build CLI
        run: go build -o kestrel ./cmd/cli/main.go
        working-directory: scanner

      - name: Scan example manifests
        run: |
          if [ -d examples ]; then
            for f in examples/*.yaml; do
              echo "Scanning $f..."
              ./scanner/kestrel scan "$f" || true
            done
          else
            echo "No examples directory — skipping manifest scan"
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrelops-scan-results
          path: scan-results/
          if-no-files-found: ignore
