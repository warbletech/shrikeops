name: Publish ShrikeOps CLI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cd scanner
          go build -ldflags "-X main.version=$VERSION -X main.commit=${{ github.sha }}" \
            -o shrikeops-${{ matrix.suffix }} ./cmd/cli/main.go

      - uses: actions/upload-artifact@v4
        with:
          name: shrikeops-${{ matrix.suffix }}
          path: scanner/shrikeops-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shrikeops-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: shrikeops-*
          generate_release_notes: true

      - name: Dispatch Homebrew tap update with SHA256s
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          TAP_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          linux_amd64=$(sha256sum shrikeops-linux-amd64 | awk '{print $1}')
          linux_arm64=$(sha256sum shrikeops-linux-arm64 | awk '{print $1}')
          darwin_amd64=$(sha256sum shrikeops-darwin-amd64 | awk '{print $1}')
          darwin_arm64=$(sha256sum shrikeops-darwin-arm64 | awk '{print $1}')

          curl -fsSL -X POST \
            -H "Authorization: Bearer $TAP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/warbletech/homebrew-tap/dispatches \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{
              \"version\":\"$VERSION\",
              \"linux_amd64_sha\":\"$linux_amd64\",
              \"linux_arm64_sha\":\"$linux_arm64\",
              \"darwin_amd64_sha\":\"$darwin_amd64\",
              \"darwin_arm64_sha\":\"$darwin_arm64\"
            }}"

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: ./scanner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
